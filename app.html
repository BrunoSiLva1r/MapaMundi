<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#018D3E">
  <title>Mesa Mundi | Entrar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css?v=20261112b">
  <script src="js/theme.js?v=20261112b"></script>
</head>
<body>
<div class="app">
  <aside>
    <a class="logo" href="index.html">mesa<span>mundi.</span></a>
    <nav id="nav"></nav>
    <div class="culture-switch" aria-label="Tema de cores">
      <small>Tema</small>
      <div>
        <button type="button" data-culture="mexico" title="México">🇲🇽</button>
        <button type="button" data-culture="italia" title="Itália">🇮🇹</button>
        <button type="button" data-culture="japao" title="Japão">🇯🇵</button>
      </div>
    </div>
  </aside>
  <main id="v"></main>
</div>
<div id="m"></div><div id="toast" role="status"></div>
<script>
  (function () {
    const buttons = document.querySelectorAll('.culture-switch button');
    const mark = () => buttons.forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.culture === MesaTheme.current())));
    buttons.forEach((b) => b.addEventListener('click', () => { MesaTheme.apply(b.dataset.culture, true); mark(); }));
    mark();
  })();
</script>
<script src="js/app.js?v=20261112b"></script>
</body>
</html>
